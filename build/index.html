<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Telegram MiniApp</title>
</head>
<body>
  <h1>Привет, <span id="username">...</span>!</h1>

  <script>
    // Проверяем, что Telegram Web App доступен
    if (window.Telegram && Telegram.WebApp) {
        const user = Telegram.WebApp.initDataUnsafe.user;

        if (user) {
            // Никнейм пользователя (username)
            const username = user.username || `${user.first_name || ''} ${user.last_name || ''}`;
            document.getElementById('username').textContent = username;
        } else {
            document.getElementById('username').textContent = 'Гость';
        }
    } else {
        document.getElementById('username').textContent = 'WebApp не найден';
    }
  </script>
</body>
</html>
