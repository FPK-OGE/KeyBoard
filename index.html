<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <title>Telegram Auth</title>
</head>
<body>
  <h1>Регистрация через Telegram</h1>
  <p id="status">Подключаемся к Telegram...</p>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    const statusEl = document.getElementById("status");
    const initData = tg.initData;

    if (!initData) {
      statusEl.textContent = "Ошибка: откройте Web App через Telegram!";
    } else {
      statusEl.textContent = "Отправляем данные на сервер...";

      fetch("http://localhost:3000/auth", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ initData })
      })
      .then(res => res.json())
      .then(data => {
        if (data.error) {
          statusEl.textContent = "Ошибка регистрации: " + data.error;
        } else {
          statusEl.textContent = `Привет, ${data.user.first_name}! Вы зарегистрированы.`;
        }
      })
      .catch(err => {
        console.error(err);
        statusEl.textContent = "Ошибка запроса к серверу";
      });
    }
  </script>
</body>
</html>
